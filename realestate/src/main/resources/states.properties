# Bundled per-state data endpoints, selected with --state <two-letter code>.
#
#   foreclosure.<ST>.endpoint   Socrata (SODA) JSON resource with foreclosure filings
#   agent.<ST>.endpoint         Socrata JSON resource with agent/broker complaints, citations, discipline
#   <type>.<ST>.field.<modelField>=<column>   column mapping (unmapped fields use the same name; raw is always kept)
#   <type>.<ST>.q               fixed full-text filter, for multi-profession / multi-case-type datasets
#   <type>.<ST>.dateColumn / stateColumn      enable --since / --state filtering inside the query
#
# Only endpoints that have been found in public sources are listed. NONE of these have been fetched from the
# development sandbox (outbound access to data portals is blocked there) - verify with a run, and add more
# states with:  ./gradlew :realestate:run --args="--discover data.<state>.gov --keyword foreclosure"
# Your own config file (--config) overrides anything here.

# ---- Delaware: disciplinary actions for all licensed professions (filtered to real estate by .q)
agent.DE.endpoint=https://data.delaware.gov/resource/dz6p-akeq.json
agent.DE.q=real estate

# ---- States with no machine-readable endpoint known yet (HTML/PDF only, or not yet discovered).
# California: DRE publishes enforcement actions/citations as web pages only:
#   https://www.dre.ca.gov/Licensees/DisciplinaryActions.html  https://www.dre.ca.gov/Licensees/CiteandFine.html
#   https://secure.dre.ca.gov/publicasp/EnforcementActions.asp
# All other states: TODO - use --discover.
